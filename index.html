<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cycling Tracker Pro</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f97316">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#0f172a;
  color:#fff;
  max-width:430px;
  margin:auto;
  padding:16px;
}

.card{
  background:#111827;
  padding:16px;
  border-radius:20px;
  margin-bottom:14px;
}

.day{
  display:flex;
  gap:10px;
  background:#1f2937;
  padding:12px;
  border-radius:12px;
  margin:6px 0;
}

.bar{
  height:10px;
  background:#334155;
  border-radius:999px;
}

.fill{
  height:100%;
  background:#f97316;
}

input[type="number"] {
  width:100%;
  padding:12px;
  margin-top:6px;
  border:none;
  border-radius:10px;
  background:#1f2937;
  color:#fff;
}
.day input[type="checkbox"]{
  width:18px;
  height:18px;
  flex:none;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#f97316;
  color:#fff;
  font-weight:bold;
}

.log-item{
  background:#1f2937;
  padding:10px;
  border-radius:10px;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="card">
<h2>🚴 Cycling Tracker</h2>
<div>Прогрес: <span id="progressText">0%</span></div>
<div class="bar"><div id="progressBar" class="fill"></div></div>

<div style="margin-top:10px;">
🔥 Калории: <span id="totalCalories">0</span><br>
⚖️ Тегло: <span id="latestWeight">-</span>
</div>
</div>

<div id="weeks"></div>

<div class="card">
<h3>Добави тренировка</h3>
<input id="caloriesInput" type="number" placeholder="Калории">
<input id="weightInput" type="number" placeholder="Тегло">
<button onclick="saveWorkoutLog()">Запази</button>
</div>

<div class="card">
<h3>📊 Прогрес</h3>
<div id="summary"></div>
</div>

<div class="card">
<h3>📚 История</h3>
<div id="history"></div>
</div>

<script>

// 🔥 SUPABASE
const supabaseClient = supabase.createClient(
'https://kudsnoxcgisxzzltlfwr.supabase.co',
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1ZHNub3hjZ2lzeHp6bHRsZndyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNjIyNDIsImV4cCI6MjA5MTkzODI0Mn0.4hUFvZJAnObCQRVHijsoMWdpXbnZt0oiKC2bZ_n9Idw'
);

// 🚴 ПОДРОБЕН ПЛАН
const weeks = [
  {
    title: 'Седмица 1',
    days: [
      'Понеделник • Почивка • раздвижване + стречинг 10–15 мин',
      'Вторник • 30 км • Zone 2 • 150–160 W • равномерно темпо за изгаряне на мазнини',
      'Сряда • 25 км • Загрявка 7 км @ 140–150 W • 4x3 мин @ 190–200 W • 3 мин леко @ 100–120 W между всяка серия • разпускане леко до общите км (25 км)',
      'Четвъртък • 15 км • Възстановително каране • 110–130 W • много леко въртене',
      'Петък • 25 км • Tempo • 170–180 W • стабилно темпо',
      'Събота • 40 км • Дълго каране • Zone 2 • 150–160 W • издръжливост и fat burn',
      'Неделя • Почивка • разходка 20–30 мин'
    ]
  },
  {
    title: 'Седмица 2',
    days: [
      'Понеделник • Почивка • раздвижване + стречинг',
      'Вторник • 35 км • Zone 2 • 150–160 W • steady каране',
      'Сряда • 30 км • Загрявка 8 км @ 140–150 W • 5x3 мин @ 195–205 W • 3 мин леко @ 100–120 W • разпускане до 30 км',
      'Четвъртък • 15 км • Възстановително каране • около 120 W',
      'Петък • 30 км • Tempo • 170–180 W',
      'Събота • 45 км • Дълго каране • Zone 2 • 150–160 W',
      'Неделя • Почивка • леко ходене'
    ]
  },
  {
    title: 'Седмица 3',
    days: [
      'Понеделник • Почивка • раздвижване + стречинг',
      'Вторник • 35 км • Zone 2 • 155–160 W',
      'Сряда • 30 км • Загрявка 8 км • 4x4 мин @ 195–205 W • 4 мин леко @ 100–120 W • разпускане до общите км',
      'Четвъртък • 20 км • Възстановително каране • 110–125 W',
      'Петък • 30 км • Tempo • 175–185 W',
      'Събота • 50 км • Дълго каране • Zone 2 • 150–160 W',
      'Неделя • Почивка • walk + стречинг'
    ]
  },
  {
    title: 'Седмица 4 (разтоварваща)',
    days: [
      'Понеделник • Почивка • възстановяване',
      'Вторник • 25 км • Easy Zone 2 • 150–155 W',
      'Сряда • 20 км • Загрявка 5 км • 3x3 мин @ 190 W • 3 мин леко @ 100–120 W • разпускане до общите км',
      'Четвъртък • Почивка • раздвижване + стречинг',
      'Петък • 20 км • Easy • 120–130 W',
      'Събота • 35 км • Леко дълго каране • около 150 W',
      'Неделя • Пълна почивка'
    ]
  }
];

// 📅 RENDER WEEKS
const weeksEl = document.getElementById('weeks');
let total = 0;

weeks.forEach((week, wi) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h3>${week.title}</h3>`;

  week.days.forEach((day, di) => {
    total++;
    const key = `${wi}-${di}`;
    const checked = localStorage.getItem(key) === '1';

    const row = document.createElement('label');
    row.className = 'day';
    row.innerHTML = `
      <input type="checkbox" ${checked ? 'checked' : ''} onchange="saveCheck('${key}', this.checked)">
      <span>${day}</span>
    `;
    card.appendChild(row);
  });

  weeksEl.appendChild(card);
});

// ☁️ LOAD FROM DB
async function loadFromSupabase() {
  const { data, error } = await supabaseClient
    .from('workouts')
    .select('*')
    .order('id');

  if (error) {
    console.log(error);
    return [];
  }

  return data;
}

// 💾 SAVE
async function saveWorkoutLog(){
  const calories = Number(document.getElementById('caloriesInput').value);
  const weight = Number(document.getElementById('weightInput').value);

  if(!calories || !weight){
    alert("Въведи калории и тегло!");
    return;
  }

  const { data, error } = await supabaseClient
    .from('workouts')
    .insert([
      {
        date: new Date().toLocaleDateString('bg-BG'),
        calories,
        weight
      }
    ]);

  if(error){
    console.log(error);
    alert("Грешка: " + error.message);
  } else {
    alert("Записано ✅");
  }

  await renderLogs();
}

// 📊 RENDER LOGS
async function renderLogs(){
  const logs = await loadFromSupabase();
  if(!logs.length) return;

  const totalCalories = logs.reduce((a,l)=>a+l.calories,0);

  const firstWeight = logs[0].weight;
  const lastWeight = logs[logs.length-1].weight;

  document.getElementById('totalCalories').textContent = totalCalories;
  document.getElementById('latestWeight').textContent = lastWeight+' кг';

  document.getElementById('history').innerHTML =
    logs.map(l=>`
      <div class="log-item">
        📅 ${l.date} • 🔥 ${l.calories} kcal • ⚖️ ${l.weight} кг
      </div>
    `).reverse().join('');

  document.getElementById('summary').innerHTML = `
    <div class="log-item">🔥 Калории: ${totalCalories}</div>
    <div class="log-item">⚖️ Разлика: ${(lastWeight-firstWeight).toFixed(1)} кг</div>
    <div class="log-item">📅 Тренировки: ${logs.length}</div>
  `;
}

// 📈 PROGRESS
function updateProgress(){
  let done = 0;

  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k.includes('-') && localStorage.getItem(k)==='1') done++;
  }

  const pct = Math.round((done/total)*100)||0;

  document.getElementById('progressText').textContent = pct+'%';
  document.getElementById('progressBar').style.width = pct+'%';
}

function saveCheck(key,val){
  localStorage.setItem(key,val?'1':'0');
  updateProgress();
}

updateProgress();
renderLogs();

</script>

</body>
</html>
