<!DOCTYPE html>

<html lang="bg">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cycling Tracker Pro</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f97316">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

<!-- CSS -->

<link rel="stylesheet" href="css/styles.css">

<!-- LIBS -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

</head>

<body>

<!-- AUTH -->

<div id="auth">
  <div class="auth-logo">
    <span class="icon">🚴</span>
    <h1>Cycling<span>Pro</span></h1>
    <p>Твоят персонален трекер</p>
  </div>
  <div class="auth-card">
    <div class="field-group">
      <div class="field">
        <span class="fi">✉️</span>
        <input id="email" type="email" placeholder="Имейл адрес" autocomplete="email">
      </div>
      <div class="field">
        <span class="fi">🔒</span>
        <input id="password" type="password" placeholder="Парола" autocomplete="current-password">
      </div>
    </div>
    <div class="auth-btns">
      <button class="btn btn-green" onclick="login()">Вход</button>
      <button class="btn btn-orange" onclick="signUp()">Регистрация</button>
    </div>
  </div>
</div>

<!-- APP -->

<div id="app">
  <div class="app-header">
    <div class="app-title">🚴 Cycling<span>Pro</span></div>
    <button class="logout-btn" onclick="logout()">Изход</button>
  </div>

  <!-- TODAY -->

  <div class="screen active" id="screen-today">
    <div class="card" id="unifiedTodayCard">
      <div id="unifiedTodayContent"></div>
    </div>

```
<div class="card">
  <div class="card-title"><span class="ct-icon">⏱️</span>Таймер</div>
  <div class="timer-wrap">
    <div class="timer-display" id="timerDisplay">00:00:00</div>
    <div class="timer-btns">
      <button class="btn btn-green" id="timerStartBtn" onclick="timerToggle()">▶ Старт</button>
      <button class="btn btn-ghost" onclick="timerReset()">⏹ Нулиране</button>
    </div>
  </div>
</div>
```

  </div>

  <!-- WEEK -->

  <div class="screen" id="screen-week">
    <div class="card">
      <div class="week-nav">
        <button class="week-nav-btn" onclick="changeWeek(-1)">‹</button>
        <div class="week-nav-title" id="weekNavTitle">Седмица 1</div>
        <button class="week-nav-btn" onclick="changeWeek(1)">›</button>
      </div>
      <div class="week-dots" id="weekDots"></div>
      <div id="weekDays"></div>
    </div>
  </div>

  <!-- LOG -->

  <div class="screen" id="screen-log">
    <div class="card">
      <div class="card-title"><span class="ct-icon">➕</span>Добави тренировка</div>
      <div class="log-form">
        <div class="log-field"><span class="lf-icon">🔥</span><input class="log-input" id="caloriesInput" type="number" placeholder="Калории"></div>
        <div class="log-field"><span class="lf-icon">⚖️</span><input class="log-input" id="weightInput" type="number" placeholder="Тегло кг" step="0.1"></div>
        <div class="log-field km-field"><span class="lf-icon">🛣️</span><input class="log-input" id="kmInput" type="number" placeholder="Изминати км" step="0.1"></div>
      </div>
      <textarea class="notes-input" id="notesInput" placeholder="📝 Бележки (по желание)..."></textarea>
      <button class="btn btn-orange" style="width:100%" onclick="saveWorkoutLog()">Запази тренировка</button>
    </div>

```
<div class="card">
  <div class="card-title"><span class="ct-icon">📚</span>История</div>
  <div id="history"></div>
</div>
```

  </div>

  <!-- STATS -->

  <div class="screen" id="screen-stats">
    <div class="card">
      <div class="card-title"><span class="ct-icon">📈</span>Графики</div>
      <canvas id="mainChart" height="200"></canvas>
    </div>

```
<div class="card">
  <div class="card-title"><span class="ct-icon">🏆</span>Обобщение</div>
  <div id="summary"></div>
</div>
```

  </div>

  <!-- PLANS -->

  <div class="screen" id="screen-plans">
    <div class="card">
      <div class="card-title"><span class="ct-icon">📚</span>Всички планове</div>
      <div id="allPlansList"></div>
    </div>
  </div>

  <!-- TAB BAR -->

  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('today',this)">🏠</button>
    <button class="tab" onclick="switchTab('week',this)">📅</button>
    <button class="tab" onclick="switchTab('log',this)">➕</button>
    <button class="tab" onclick="switchTab('stats',this)">📈</button>
    <button class="tab" onclick="switchTab('plans',this)">🗂️</button>
  </div>
</div>

<!-- MODALS -->

<div class="modal-overlay" id="repeatModal">
  <div class="modal">
    <div class="modal-title">🏆 Планът е завършен!</div>
    <button class="btn btn-orange" onclick="repeatPlan()">Повтори</button>
  </div>
</div>

<div class="modal-overlay" id="goalModal">
  <div class="modal">
    <div class="modal-title">🎯 Целево тегло</div>
    <button class="btn btn-orange" onclick="saveWeightGoal()">Запази</button>
  </div>
</div>

<!-- JS FILES -->

<script src="js/utils.js"></script>

<script src="js/auth.js"></script>

<script src="js/timer.js"></script>

<script src="js/logs.js"></script>

<script src="js/stats.js"></script>

<script src="js/plans.js"></script>

<script src="js/main.js"></script>

</body>
</html>
