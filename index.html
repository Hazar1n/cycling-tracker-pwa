body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#0f172a;
  color:#fff;
  max-width:430px;
  margin:auto;
  padding:16px;

.card{
  background:#111827;
  padding:16px;
  border-radius:20px;
  margin-bottom:14px;
}

.day{
  display:flex;
  gap:10px;
  background:#1f2937;
  padding:12px;
  border-radius:12px;
  margin:6px 0;
}

.bar{
  height:10px;
  background:#334155;
  border-radius:999px;
}

.fill{
  height:100%;
  background:#f97316;
}

input[type="number"] {
  width:100%;
  padding:12px;
  margin-top:6px;
  border:none;
  border-radius:10px;
  background:#1f2937;
  color:#fff;
}
.day input[type="checkbox"]{
  width:18px;
  height:18px;
  flex:none;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#f97316;
  color:#fff;
  font-weight:bold;
}

.log-item{
  background:#1f2937;
  padding:10px;
  border-radius:10px;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="card" id="auth">
  <h3>🔐 Вход</h3>
  <input id="email" type="email" placeholder="Имейл">
  <input id="password" type="password" placeholder="Парола">
  <button onclick="signUp()">Регистрация</button>
  <button onclick="login()">Вход</button>
  <button onclick="logout()">Изход</button>
</div>

<div id="app" style="display:none">

<div class="card">
<h2>🚴 Cycling Tracker</h2>
<div>Прогрес: <span id="progressText">0%</span></div>
<div class="bar"><div id="progressBar" class="fill"></div></div>

<div style="margin-top:10px;">
🔥 Калории: <span id="totalCalories">0</span><br>
⚖️ Тегло: <span id="latestWeight">-</span>
</div>
</div>

<div class="card">
<h3>Добави тренировка</h3>
<input id="caloriesInput" type="number" placeholder="Калории">
<input id="weightInput" type="number" placeholder="Тегло">
<button onclick="saveWorkoutLog()">Запази</button>
</div>

<div class="card">
<h3>📊 Прогрес</h3>
<div id="summary"></div>
</div>

<div class="card">
<h3>📚 История</h3>
<div id="history"></div>
</div>

<div class="card">
  <h3>📈 Графика на теглото</h3>
  <canvas id="weightChart"></canvas>
</div>
</div>

<script>

// 🔐 SIGN UP
async function signUp(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password
  });

  if(error){
    alert(error.message);
  } else {
    alert("Регистриран ✅");
  }
}

// 🔑 LOGIN
async function login(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    alert(error.message);
  } else {
    alert("Влязъл си ✅");
    checkUser(); // 🔥 важно
  }
}

// 👤 CHECK USER
async function checkUser(){
  const { data } = await supabaseClient.auth.getUser();

  const user = data.user;

  if(user){
    document.getElementById('app').style.display = 'block';
    document.getElementById('auth').style.display = 'none';

    renderLogs();
  } else {
    document.getElementById('app').style.display = 'none';
    document.getElementById('auth').style.display = 'block';
  }
}

// 🚪 LOGOUT
async function logout(){
  await supabaseClient.auth.signOut();
  alert("Излезе");
}

// 🔥 SUPABASE

);
console.log("SUPABASE:", supabaseClient);

// 🚴 ПОДРОБЕН ПЛАН
const weeks = [
  {
    title: 'Седмица 1',
    days: [
      'Понеделник • Почивка • раздвижване + стречинг 10–15 мин',
      'Вторник • 30 км • Zone 2 • 150–160 W • равномерно темпо за изгаряне на мазнини',
      'Сряда • 25 км • Загрявка 7 км @ 140–150 W • 4x3 мин @ 190–200 W • 3 мин леко @ 100–120 W между всяка серия • разпускане леко до общите км (25 км)',
      'Четвъртък • 15 км • Възстановително каране • 110–130 W • много леко въртене',
      'Петък • 25 км • Tempo • 170–180 W • стабилно темпо',
      'Събота • 40 км • Дълго каране • Zone 2 • 150–160 W • издръжливост и fat burn',
      'Неделя • Почивка • разходка 20–30 мин'
    ]
  },

      'Четвъртък • 15 км • Възстановително каране • около 120 W',
      'Петък • 30 км • Tempo • 170–180 W',

      'Неделя • Почивка • леко ходене'
    ]

  {

      'Четвъртък • 20 км • Възстановително каране • 110–125 W',
      'Петък • 30 км • Tempo • 175–185 W',

      'Неделя • Пълна почивка'
    ]
  }
];

// 📅 RENDER WEEKS
const weeksEl = document.getElementById('weeks');
let total = 0;

weeks.forEach((week, wi) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h3>${week.title}</h3>`;

  week.days.forEach((day, di) => {
    total++;
    const key = `${wi}-${di}`;
    const checked = localStorage.getItem(key) === '1';

    const row = document.createElement('label');
    row.className = 'day';
    row.innerHTML = `
      <input type="checkbox" ${checked ? 'checked' : ''} onchange="saveCheck('${key}', this.checked)">
      <span>${day}</span>
    `;
    card.appendChild(row);
  });

  weeksEl.appendChild(card);
});

// ☁️ LOAD FROM DB
async function loadFromSupabase() {
  const { data, error } = await supabaseClient
    .from('workouts')
    .select('*')
    .order('id', { ascending: true });

  if (error) {
    console.log("Грешка при зареждане:", error);
    return [];
  }

  console.log("ДАННИ ОТ БАЗАТА:", data);

  return data || [];
}

// 💾 SAVE
async function saveWorkoutLog(){
  const calories = Number(document.getElementById('caloriesInput').value);
  const weight = Number(document.getElementById('weightInput').value);

  const { data: userData } = await supabaseClient.auth.getUser();

  const user = userData.user;

  if(!user){
    alert("Трябва да си логнат!");
    return;
  }

  await supabaseClient.from('workouts').insert([
    {
      date: new Date().toLocaleDateString('bg-BG'),
      calories,
      weight,
      user_id: user.id
    }
  ]);

  renderLogs();
}

// 📊 RENDER LOGS
async function renderLogs() {
  const logs = await loadFromSupabase();

  const caloriesEl = document.getElementById('totalCalories');
  const weightEl = document.getElementById('latestWeight');
  const historyEl = document.getElementById('history');
  const summaryEl = document.getElementById('summary');

  if(logs.length === 0) return;

  // 👉 ТУК е правилното място
  renderChart(logs);

  const totalCalories = logs.reduce((sum, l) => sum + Number(l.calories || 0), 0);

  const firstWeight = Number(logs[0].weight);
  const lastWeight = Number(logs[logs.length - 1].weight);

  caloriesEl.textContent = totalCalories;
  weightEl.textContent = lastWeight + " кг";

  historyEl.innerHTML = logs.map(l => `
    <div class="log-item">
      📅 ${l.date} • 🔥 ${l.calories} kcal • ⚖️ ${l.weight} кг
    </div>
  `).reverse().join('');

  summaryEl.innerHTML = `
    <div class="log-item">🔥 Общо калории: ${totalCalories}</div>
    <div class="log-item">⚖️ Разлика: ${(lastWeight-firstWeight).toFixed(1)} кг</div>
  `;
}

async function loadFromSupabase() {

  const { data: userData } = await supabaseClient.auth.getUser();
  const user = userData.user;

  if(!user) return [];

  const { data, error } = await supabaseClient
    .from('workouts')
    .select('*')
    .eq('user_id', user.id)
    .order('id', { ascending: true });

  if(error){
    console.log(error);
    return [];
  }

  return data;
}

// 📊 ГРАФИКА
let chart;

function renderChart(logs){
  const ctx = document.getElementById('weightChart');

  const labels = logs.map(l => l.date);
  const weights = logs.map(l => Number(l.weight));

  if(chart){
    chart.destroy();
  }

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Тегло (кг)',
        data: weights,
        borderColor: '#f97316',
        backgroundColor: 'rgba(249,115,22,0.2)',
        tension: 0.3,
        fill: true
      }]
    },
    options: {
      plugins: {
        legend: {
          labels: { color: '#fff' }
        }
      },
      scales: {
        x: {
          ticks: { color: '#ccc' }
        },
        y: {
          ticks: { color: '#ccc' }
        }
      }
    }
  });
}


// 📈 PROGRESS
function updateProgress(){
  let done = 0;

  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k.includes('-') && localStorage.getItem(k)==='1') done++;
  }

  const pct = Math.round((done/total)*100)||0;

  document.getElementById('progressText').textContent = pct+'%';
  document.getElementById('progressBar').style.width = pct+'%';
}

function saveCheck(key,val){
  localStorage.setItem(key,val?'1':'0');
  updateProgress();
}

checkUser();
updateProgress();
renderLogs();

</script>

</body>
</html>
